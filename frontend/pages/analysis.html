<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#080b12"/>
  <title>Banklytics – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
/* ═══════════════════════════════════════════════════
   BANKLYTICS DASHBOARD — AURA-INSPIRED DARK THEME
   Font: Syne (headings) + Space Grotesk (body) + JetBrains Mono (numbers)
═══════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg:        #080b12;
  --bg2:       #0d1117;
  --surface:   #111820;
  --surface2:  #161e2a;
  --border:    #1e2a38;
  --border2:   #243040;
  --text:      #e2e8f0;
  --text-dim:  #8899aa;
  --text-muted:#4a5568;
  --green:     #00e5a0;
  --green2:    #00c988;
  --red:       #ff4d6d;
  --blue:      #3b9eff;
  --purple:    #a855f7;
  --yellow:    #f59e0b;
  --cyan:      #06b6d4;
  --sidebar-w: 240px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  min-height:100vh;
  display:flex;
  overflow-x:hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* ══════════════════════════════════
   SIDEBAR
══════════════════════════════════ */
.sidebar{
  width:var(--sidebar-w);
  min-height:100vh;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;
  z-index:200;
  transition:transform 0.3s ease;
}

.sidebar-logo{
  padding:1.5rem 1.25rem 1rem;
  display:flex;align-items:center;gap:0.65rem;
  border-bottom:1px solid var(--border);
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  border-radius:10px;
  display:grid;place-items:center;
  font-size:1rem;font-weight:800;color:#080b12;
  font-family:'Syne',sans-serif;
  flex-shrink:0;
}
.logo-text{
  font-family:'Syne',sans-serif;
  font-size:1.1rem;font-weight:800;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.sidebar-nav{flex:1;padding:1rem 0.75rem;display:flex;flex-direction:column;gap:0.2rem}

.nav-section-label{
  font-size:0.65rem;font-weight:600;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--text-muted);
  padding:0.75rem 0.5rem 0.4rem;
}

.nav-item{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.65rem 0.75rem;
  border-radius:8px;
  font-size:0.875rem;font-weight:500;
  color:var(--text-dim);
  cursor:pointer;
  transition:all 0.15s;
  text-decoration:none;
  position:relative;
}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{
  background:rgba(0,229,160,0.08);
  color:var(--green);
  border:1px solid rgba(0,229,160,0.15);
}
.nav-item.active::before{
  content:'';position:absolute;left:-0.75rem;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--green);border-radius:0 3px 3px 0;
}
.nav-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--green);color:#080b12;
  font-size:0.65rem;font-weight:700;padding:0.15rem 0.5rem;
  border-radius:100px;
}

.sidebar-user{
  padding:1rem 1.25rem;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:0.65rem;
}
.user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  display:grid;place-items:center;
  font-size:0.75rem;font-weight:700;color:#080b12;
  flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:0.7rem;color:var(--text-muted)}
.logout-btn{
  background:none;border:none;color:var(--text-muted);
  cursor:pointer;font-size:0.9rem;padding:0.3rem;border-radius:5px;
}
.logout-btn:hover{color:var(--red)}

/* ══════════════════════════════════
   MAIN CONTENT
══════════════════════════════════ */
.main{
  margin-left:var(--sidebar-w);
  flex:1;
  display:flex;flex-direction:column;
  min-height:100vh;
}

/* ── Topbar ── */
.topbar{
  height:60px;
  background:rgba(8,11,18,0.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 1.5rem;gap:1rem;
  position:sticky;top:0;z-index:100;
}
.topbar-title{
  font-family:'Syne',sans-serif;
  font-size:1rem;font-weight:700;
  flex:1;
}
.topbar-live{
  display:flex;align-items:center;gap:0.4rem;
  font-size:0.72rem;color:var(--green);font-weight:500;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}

.topbar-period{
  display:flex;gap:0.2rem;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.25rem;
}
.period-btn{
  font-size:0.72rem;font-weight:600;padding:0.3rem 0.75rem;
  border-radius:5px;border:none;background:none;color:var(--text-muted);cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  transition:all 0.15s;
}
.period-btn.active{background:var(--green);color:#080b12}

.topbar-back{
  display:flex;align-items:center;gap:0.4rem;
  font-size:0.78rem;color:var(--text-muted);
  text-decoration:none;padding:0.4rem 0.75rem;
  border:1px solid var(--border);border-radius:7px;
  transition:all 0.15s;
}
.topbar-back:hover{color:var(--text);border-color:var(--border2)}

/* ── Page content ── */
.content{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}

/* ── Alert banner ── */
.alert-banner{
  background:rgba(255,77,109,0.08);
  border:1px solid rgba(255,77,109,0.25);
  border-radius:10px;
  padding:0.75rem 1rem;
  display:flex;align-items:center;gap:0.75rem;
  font-size:0.82rem;
  display:none;
}
.alert-banner.visible{display:flex}
.alert-icon{font-size:1rem;flex-shrink:0}
.alert-text{flex:1;color:var(--text-dim)}
.alert-text strong{color:var(--red)}
.alert-action{
  font-size:0.72rem;font-weight:600;color:var(--red);
  border:1px solid rgba(255,77,109,0.3);border-radius:5px;
  padding:0.3rem 0.65rem;cursor:pointer;white-space:nowrap;
  background:none;
}

/* ── Metric cards ── */
.metrics-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0.85rem;
}
.metric-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.1rem 1.25rem;
  position:relative;overflow:hidden;
  transition:border-color 0.2s,transform 0.15s;
}
.metric-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.metric-card::after{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;border-radius:0 12px 0 60px;
  opacity:0.06;
}
.metric-card.green::after{background:var(--green)}
.metric-card.red::after{background:var(--red)}
.metric-card.blue::after{background:var(--blue)}
.metric-card.purple::after{background:var(--purple)}
.metric-card.yellow::after{background:var(--yellow)}

.metric-icon{
  font-size:1.1rem;margin-bottom:0.75rem;
  width:34px;height:34px;border-radius:8px;
  display:grid;place-items:center;
}
.metric-card.green .metric-icon{background:rgba(0,229,160,0.1)}
.metric-card.red   .metric-icon{background:rgba(255,77,109,0.1)}
.metric-card.blue  .metric-icon{background:rgba(59,158,255,0.1)}
.metric-card.purple.metric-icon{background:rgba(168,85,247,0.1)}
.metric-card.yellow .metric-icon{background:rgba(245,158,11,0.1)}

.metric-label{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:0.35rem}
.metric-value{
  font-family:'JetBrains Mono',monospace;
  font-size:1.35rem;font-weight:500;line-height:1;margin-bottom:0.3rem;
}
.metric-card.green .metric-value{color:var(--green)}
.metric-card.red   .metric-value{color:var(--red)}
.metric-card.blue  .metric-value{color:var(--blue)}
.metric-card.purple .metric-value{color:var(--purple)}
.metric-card.yellow .metric-value{color:var(--yellow)}
.metric-sub{font-size:0.7rem;color:var(--text-muted);display:flex;align-items:center;gap:0.3rem}
.metric-trend{font-size:0.68rem;font-weight:600}
.metric-trend.up{color:var(--green)}
.metric-trend.down{color:var(--red)}

/* ── Charts row ── */
.charts-row{display:grid;grid-template-columns:1.6fr 1fr;gap:1.25rem}

.chart-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;
}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.chart-title{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700}
.chart-sub{font-size:0.72rem;color:var(--text-muted);margin-top:0.1rem}
.chart-legend{display:flex;gap:0.75rem}
.legend-item{display:flex;align-items:center;gap:0.35rem;font-size:0.72rem;color:var(--text-dim)}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* ── Health score ring ── */
.health-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;
  display:flex;flex-direction:column;
}
.health-ring-wrap{
  display:flex;flex-direction:column;align-items:center;gap:0.5rem;flex:1;justify-content:center;padding:0.5rem 0;
}
.health-ring{position:relative;width:140px;height:140px}
.health-ring svg{transform:rotate(-90deg)}
.health-ring-track{fill:none;stroke:var(--border);stroke-width:10}
.health-ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
.health-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
}
.health-score{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:500;line-height:1}
.health-label{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:0.2rem}
.health-desc{font-size:0.75rem;color:var(--text-dim);text-align:center;line-height:1.4;max-width:200px}

/* ── Bottom row ── */
.bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem}

/* ── Category bars ── */
.cat-list{display:flex;flex-direction:column;gap:0.6rem;margin-top:0.25rem}
.cat-item{}
.cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.3rem}
.cat-name{font-size:0.78rem;font-weight:500;display:flex;align-items:center;gap:0.4rem}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cat-pct{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--text-muted)}
.cat-bar-bg{height:4px;background:var(--border);border-radius:10px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:10px;transition:width 0.8s ease}
.cat-amt{font-size:0.7rem;color:var(--text-muted);margin-top:0.15rem;font-family:'JetBrains Mono',monospace}

/* ── Top merchants ── */
.merchant-list{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.25rem}
.merchant-item{
  display:flex;align-items:center;gap:0.65rem;
  padding:0.55rem 0.75rem;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
}
.merchant-num{font-size:0.65rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;width:16px;text-align:right;flex-shrink:0}
.merchant-icon{
  width:28px;height:28px;border-radius:7px;
  background:var(--border);display:grid;place-items:center;font-size:0.75rem;flex-shrink:0;
}
.merchant-name{flex:1;font-size:0.78rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.merchant-amt{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--red);font-weight:500}

/* ── Transactions table ── */
.txn-wrap{overflow:auto;max-height:280px;margin-top:0.25rem}
.txn-table{width:100%;border-collapse:collapse;min-width:500px}
.txn-table th{
  font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;
  color:var(--text-muted);padding:0.5rem 0.65rem;text-align:left;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.txn-table td{padding:0.55rem 0.65rem;font-size:0.78rem;border-bottom:1px solid var(--border)}
.txn-table tr:last-child td{border-bottom:none}
.txn-table tbody tr:hover td{background:var(--surface2)}
.txn-desc{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.txn-merchant{font-size:0.72rem;color:var(--text-muted)}
.amt-debit{color:var(--red);font-family:'JetBrains Mono',monospace;font-weight:500}
.amt-credit{color:var(--green);font-family:'JetBrains Mono',monospace;font-weight:500}
.cat-chip{
  font-size:0.62rem;font-weight:600;padding:0.18rem 0.5rem;border-radius:100px;
  background:rgba(59,158,255,0.1);color:var(--blue);white-space:nowrap;
}
.type-chip{
  font-size:0.6rem;font-weight:700;padding:0.15rem 0.45rem;border-radius:100px;
}
.type-chip.debit{background:rgba(255,77,109,0.12);color:var(--red)}
.type-chip.credit{background:rgba(0,229,160,0.12);color:var(--green)}

/* ── Loading / Error ── */
.state-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;gap:1rem;text-align:center;
}
.state-spinner{
  width:40px;height:40px;border:3px solid rgba(0,229,160,0.2);
  border-top-color:var(--green);border-radius:50%;animation:spin 0.7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700}
.state-sub{font-size:0.82rem;color:var(--text-muted);max-width:300px}

/* ── Toast ── */
#toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem}
.toast{
  background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:0.65rem 1rem;font-size:0.82rem;
  display:flex;align-items:center;gap:0.5rem;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  animation:slideIn 0.2s ease;
}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--blue)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ── Mobile hamburger ── */
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;padding:0.25rem}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:199}

/* ══════════════════════════════════
   RESPONSIVE
══════════════════════════════════ */
@media(max-width:1100px){
  .metrics-grid{grid-template-columns:repeat(3,1fr)}
  .bottom-row{grid-template-columns:1fr 1fr}
}
@media(max-width:860px){
  .charts-row{grid-template-columns:1fr}
  .bottom-row{grid-template-columns:1fr}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  :root{--sidebar-w:240px}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .main{margin-left:0}
  .hamburger{display:block}
  .content{padding:1rem}
  .metrics-grid{grid-template-columns:1fr 1fr}
  .metric-value{font-size:1.1rem}
  .topbar-period{display:none}
  .topbar-back span{display:none}
}
@media(max-width:400px){
  .metrics-grid{grid-template-columns:1fr}
}
  </style>
</head>

</a>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/static/js/utils.js"></script>
<script>
initFirebase();

// ── Chart.js defaults ─────────────────────────────────────────────────────
Chart.defaults.color       = "#4a5568";
Chart.defaults.borderColor = "#1e2a38";
Chart.defaults.font.family = "'Space Grotesk', sans-serif";
Chart.defaults.font.size   = 11;

const COLORS = ["#00e5a0","#3b9eff","#a855f7","#f59e0b","#ff4d6d","#06b6d4","#f97316","#84cc16","#ec4899","#14b8a6","#8b5cf6","#fbbf24","#ef4444","#22d3ee","#a3e635"];

// ── Sidebar toggle ────────────────────────────────────────────────────────
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("open");
}

// ── Period filter (UI only for now) ──────────────────────────────────────
function setPeriod(btn, period){
  document.querySelectorAll(".period-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// ── Auth ──────────────────────────────────────────────────────────────────
let currentUser = null;
let _allData    = null;

(async()=>{
  currentUser = await requireAuth();
  if(!currentUser) return;
  const name    = currentUser.displayName || currentUser.email || "User";
  const initials= name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
  document.getElementById("sidebarAvatar").textContent = initials;
  document.getElementById("sidebarName").textContent   = name;
  await runAnalysis();
})();

async function runAnalysis(){
  try{
    // Analysis already ran in the pipeline — just fetch existing data
    const data = await apiFetch("/api/analysis/data");
    _allData = data;
    renderDashboard(data);
  }catch(err){
    document.getElementById("pageContent").innerHTML = `
      <div class="state-screen">
        <div style="font-size:2rem">⚠️</div>
        <div class="state-title">Analysis Failed</div>
        <div class="state-sub">${err.message}</div>
        <a href="/home" class="topbar-back" style="margin-top:1rem">← Upload a statement first</a>
      </div>`;
  }
}

// ── Formatters ────────────────────────────────────────────────────────────
const fmtINR = n => "₹" + Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK   = n => {
  n = Number(n||0);
  if(n>=100000) return "₹"+(n/100000).toFixed(1)+"L";
  if(n>=1000)   return "₹"+(n/1000).toFixed(1)+"K";
  return "₹"+n.toFixed(0);
};

// ── Compute health score ──────────────────────────────────────────────────
function computeHealth(summary, catBreakdown){
  let score = 50;
  const savingsRate = summary.total_credit > 0 ? (summary.net_flow / summary.total_credit) * 100 : 0;
  if(savingsRate > 20) score += 20;
  else if(savingsRate > 10) score += 10;
  else if(savingsRate < 0) score -= 20;

  const topCat = catBreakdown[0];
  if(topCat && topCat.percent < 30) score += 10;
  else if(topCat && topCat.percent > 50) score -= 10;

  if(summary.net_flow >= 0) score += 20;
  else score -= 10;

  return Math.max(10, Math.min(100, Math.round(score)));
}

function healthLabel(score){
  if(score >= 80) return {label:"EXCELLENT", color:"#00e5a0"};
  if(score >= 65) return {label:"GOOD",      color:"#3b9eff"};
  if(score >= 45) return {label:"FAIR",      color:"#f59e0b"};
  return              {label:"POOR",         color:"#ff4d6d"};
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderDashboard(data){
  const {summary, category_breakdown, monthly_trend, top_merchants, transactions} = data;
  const health     = computeHealth(summary, category_breakdown);
  const healthInfo = healthLabel(health);
  const netPos     = summary.net_flow >= 0;
  const savingsRate= summary.total_credit > 0 ? ((summary.net_flow/summary.total_credit)*100).toFixed(1) : "0.0";

  document.getElementById("pageContent").innerHTML = `

    <!-- Alert banner -->
    <div class="alert-banner" id="alertBanner">
      <span class="alert-icon">🛡</span>
      <span class="alert-text"><strong>Security Alert:</strong> Anomaly detection will be available in the next update.</span>
      <button class="alert-action" onclick="document.getElementById('alertBanner').style.display='none'">Dismiss</button>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
      <div class="metric-card green">
        <div class="metric-icon">↑</div>
        <div class="metric-label">Monthly Inflow</div>
        <div class="metric-value">${fmtK(summary.total_credit)}</div>
        <div class="metric-sub"><span class="metric-trend up">↑ Credit</span> total received</div>
      </div>
      <div class="metric-card red">
        <div class="metric-icon">↓</div>
        <div class="metric-label">Monthly Outflow</div>
        <div class="metric-value">${fmtK(summary.total_debit)}</div>
        <div class="metric-sub"><span class="metric-trend down">↓ Debit</span> total spent</div>
      </div>
      <div class="metric-card blue">
        <div class="metric-icon">⇌</div>
        <div class="metric-label">Net Liquidity</div>
        <div class="metric-value" style="color:${netPos?'var(--green)':'var(--red)'}">${fmtK(Math.abs(summary.net_flow))}</div>
        <div class="metric-sub"><span class="metric-trend ${netPos?'up':'down'}">${netPos?'↑ Surplus':'↓ Deficit'}</span></div>
      </div>
      <div class="metric-card purple">
        <div class="metric-icon">%</div>
        <div class="metric-label">Savings Rate</div>
        <div class="metric-value" style="color:var(--purple)">${savingsRate}%</div>
        <div class="metric-sub">${Number(savingsRate)>10?'<span class="metric-trend up">↑ On track</span>':'<span class="metric-trend down">↓ Below target</span>'}</div>
      </div>
      <div class="metric-card yellow">
        <div class="metric-icon">⬡</div>
        <div class="metric-label">Total Txns</div>
        <div class="metric-value" style="color:var(--yellow)">${summary.total_transactions}</div>
        <div class="metric-sub">Balance: ${fmtK(summary.latest_balance)}</div>
      </div>
    </div>

    <!-- Charts row -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Cash Flow Index</div>
            <div class="chart-sub">Monthly inflow vs outflow</div>
          </div>
          <div class="chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Credits</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Debits</div>
          </div>
        </div>
        <div style="height:200px;position:relative"><canvas id="areaChart"></canvas></div>
      </div>

      <div class="health-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Financial Health</div>
            <div class="chart-sub">Risk & wellness score</div>
          </div>
        </div>
        <div class="health-ring-wrap">
          <div class="health-ring">
            <svg viewBox="0 0 140 140" width="140" height="140">
              <circle class="health-ring-track" cx="70" cy="70" r="56"/>
              <circle class="health-ring-fill" id="healthFill" cx="70" cy="70" r="56"
                stroke="${healthInfo.color}"
                stroke-dasharray="${2*Math.PI*56}"
                stroke-dashoffset="${2*Math.PI*56}"/>
            </svg>
            <div class="health-center">
              <div class="health-score" style="color:${healthInfo.color}" id="healthScoreEl">0</div>
              <div class="health-label">${healthInfo.label}</div>
            </div>
          </div>
          <div class="health-desc" id="healthDesc">Calculating your financial wellness…</div>
        </div>
      </div>
    </div>

    <!-- Bottom row -->
    <div class="bottom-row">
      <!-- Category breakdown -->
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Spending Categories</div></div>
        <div class="cat-list" id="catList"></div>
      </div>

      <!-- Top merchants -->
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Top Merchants</div></div>
        <div class="merchant-list" id="merchantList"></div>
      </div>

      <!-- Donut -->
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Spend Distribution</div>
            <div class="chart-sub">By category share</div>
          </div>
        </div>
        <div style="height:220px;position:relative"><canvas id="donutChart"></canvas></div>
      </div>
    </div>

    <!-- Transactions -->
    <div class="chart-card">
      <div class="chart-header">
        <div>
          <div class="chart-title">Recent Transactions</div>
          <div class="chart-sub">${transactions.length} total</div>
        </div>
      </div>
      <div class="txn-wrap">
        <table class="txn-table">
          <thead>
            <tr>
              <th>Date</th><th>Description</th><th>Merchant</th>
              <th>Amount</th><th>Type</th><th>Category</th><th>Balance</th>
            </tr>
          </thead>
          <tbody id="txnBody"></tbody>
        </table>
      </div>
    </div>
  `;

  // ── Area chart ──
  const months = monthly_trend.map(m=>m.month);
  new Chart(document.getElementById("areaChart"),{
    type:"line",
    data:{
      labels: months,
      datasets:[
        {
          label:"Credits",
          data: monthly_trend.map(m=>m.credit),
          borderColor:"#00e5a0",borderWidth:2,pointRadius:4,
          pointBackgroundColor:"#00e5a0",
          fill:true,
          backgroundColor: ctx=>{
            const g = ctx.chart.ctx.createLinearGradient(0,0,0,200);
            g.addColorStop(0,"rgba(0,229,160,0.25)");
            g.addColorStop(1,"rgba(0,229,160,0)");
            return g;
          },
          tension:0.4,
        },
        {
          label:"Debits",
          data: monthly_trend.map(m=>m.debit),
          borderColor:"#ff4d6d",borderWidth:2,pointRadius:4,
          pointBackgroundColor:"#ff4d6d",
          fill:true,
          backgroundColor: ctx=>{
            const g = ctx.chart.ctx.createLinearGradient(0,0,0,200);
            g.addColorStop(0,"rgba(255,77,109,0.2)");
            g.addColorStop(1,"rgba(255,77,109,0)");
            return g;
          },
          tension:0.4,
        }
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${fmtINR(ctx.parsed.y)}`}}},
      scales:{
        x:{grid:{color:"rgba(30,42,56,0.8)"},ticks:{maxTicksLimit:6}},
        y:{grid:{color:"rgba(30,42,56,0.8)"},ticks:{callback:v=>fmtK(v)},beginAtZero:true}
      }
    }
  });

  // ── Health ring animation ──
  const circumference = 2 * Math.PI * 56;
  const offset = circumference - (health / 100) * circumference;
  const fill = document.getElementById("healthFill");
  const scoreEl = document.getElementById("healthScoreEl");
  setTimeout(()=>{
    fill.style.strokeDashoffset = offset;
    let curr = 0;
    const interval = setInterval(()=>{
      curr = Math.min(curr + 2, health);
      scoreEl.textContent = curr;
      if(curr >= health) clearInterval(interval);
    }, 20);
  }, 300);

  // Health desc
  const descs = {
    EXCELLENT: "Your finances are in great shape. Consistent savings and diversified spending.",
    GOOD:      "Good financial habits. Look for areas to optimise your spending.",
    FAIR:      "Room for improvement. Consider reducing discretionary spending.",
    POOR:      "High outflow detected. Review your largest spending categories.",
  };
  document.getElementById("healthDesc").textContent = descs[healthInfo.label];

  // ── Category list ──
  const topCats = category_breakdown.slice(0,8);
  const maxAmt  = topCats[0]?.amount || 1;
  const catList = document.getElementById("catList");
  topCats.forEach((c,i)=>{
    catList.innerHTML += `
      <div class="cat-item">
        <div class="cat-top">
          <div class="cat-name">
            <div class="cat-dot" style="background:${COLORS[i%COLORS.length]}"></div>
            ${c.category}
          </div>
          <div class="cat-pct">${c.percent}%</div>
        </div>
        <div class="cat-bar-bg">
          <div class="cat-bar-fill" style="width:${(c.amount/maxAmt*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}"></div>
        </div>
        <div class="cat-amt">${fmtINR(c.amount)} · ${c.count} txns</div>
      </div>`;
  });

  // ── Merchants ──
  const icons = ["🛒","🏠","🍕","🎬","💊","✈️","⛽","🎓","💰","📱"];
  const ml = document.getElementById("merchantList");
  top_merchants.slice(0,7).forEach((m,i)=>{
    ml.innerHTML += `
      <div class="merchant-item">
        <span class="merchant-num">${i+1}</span>
        <div class="merchant-icon">${icons[i%icons.length]}</div>
        <span class="merchant-name">${m.merchant||"Unknown"}</span>
        <span class="merchant-amt">${fmtINR(m.amount)}</span>
      </div>`;
  });

  // ── Donut chart ──
  const dCats = category_breakdown.slice(0,9);
  new Chart(document.getElementById("donutChart"),{
    type:"doughnut",
    data:{
      labels: dCats.map(c=>c.category),
      datasets:[{
        data: dCats.map(c=>c.amount),
        backgroundColor: COLORS.slice(0,dCats.length),
        borderColor:"#111820",borderWidth:3,hoverOffset:6
      }]
    },
    options:{
      cutout:"68%",
      plugins:{
        legend:{position:"bottom",labels:{boxWidth:8,padding:8,font:{size:10}}},
        tooltip:{callbacks:{label:ctx=>` ${fmtINR(ctx.parsed)} (${dCats[ctx.dataIndex].percent}%)`}}
      }
    }
  });

  // ── Transactions table ──
  const tbody = document.getElementById("txnBody");
  transactions.slice(0,150).forEach(t=>{
    const isD = t.TYPE==="DEBIT";
    tbody.innerHTML += `
      <tr>
        <td style="white-space:nowrap;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.72rem">${t.DATE||""}</td>
        <td><div class="txn-desc" title="${t.TRANSACTION||""}">${t.TRANSACTION||""}</div></td>
        <td class="txn-merchant">${t.Merchant||"—"}</td>
        <td class="${isD?'amt-debit':'amt-credit'}">${isD?"-":"+"}${fmtINR(t.AMOUNT)}</td>
        <td><span class="type-chip ${isD?'debit':'credit'}">${t.TYPE||""}</span></td>
        <td><span class="cat-chip">${t.category||"—"}</span></td>
        <td style="color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.72rem">${t.BALANCE?fmtINR(t.BALANCE):""}</td>
      </tr>`;
  });
  if(transactions.length>150){
    tbody.innerHTML+=`<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:0.85rem;font-size:0.75rem">Showing 150 of ${transactions.length} transactions</td></tr>`;
  }
}

function handleSignOut(){ signOut(); }
</script>
